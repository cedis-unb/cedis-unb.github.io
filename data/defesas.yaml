  - id: rafael-teodosio-2022-09-28
    type: tcc
    program: curso_esw
    scheduled_date: '2022-09-28T00:00:00-03:00'
    held_date: '2022-09-28'
    title:
      pt: $tudy - um sistema gamificado de educação financeira
      en: $tudy - A Gamified Financial Education System
    summary:
      pt: O objetivo deste trabalho é projetar e implementar um sistema gamificado para educação financeira. O método utilizado foi a construção típica da engenharia de software com levantamento de 
        requisitos bem como o estudo da literatura referentes aos frameworks de gamificação, em especial ao Octalysis, juntamente com o estudo das metodologias de desenvolvimento de software 
        utilizadas para o planejamento do sistema. No presente trabalho é apresentados o levantamento de requisitos e sua priorização bem como as especificações necessárias para o sistema 
        implementado, também é apresentado um protótipo onde é definida a identidade visual e o protótipo das telas presentes no sistema juntamente com a modelagem relacional dos dados e suas 
        entidades, além de apresentar a arquitetura da aplicação onde mostra como foi estruturada a aplicação, e sua versão final.
      en: The objective of this work is to design and implement a gamified system for financial education. The method used was the typical software engineering construction with requirements gathering
        as well as a literature study of the The method used was a typical software engineering construction with a survey of requirements and a literature study of gamification frameworks, especially
        Octalysis, along with the study of software development methodologies used to plan the system. In this work we present the requirements survey and its prioritization as well as the necessary 
        specifications for the implemented system. We also present a prototype where we define the visual identity and the prototype of the screens present in the system along with the relational 
        modeling of the data and its entities, and present the application architecture where we show how the application was structured, and its final version.
