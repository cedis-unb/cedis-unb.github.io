  - id: geovanna-mylena-2026-06-15
    type: tcc
    program: curso_esw2
    scheduled_date: '2026-06-15T00:00:00-03:00'
    held_date: '2026-06-15'
    title:
      pt: 'Atloria: Uma plataforma gamificada para visualização de estrutura de dados em realidade aumentada'
      en: 'Atloria: A Gamified Platform for Data Structure Visualization in Augmented Reality'
    summary:
      pt: >-
        A aprendizagem de estruturas de dados e algoritmos é um dos desafios recorrentes nos cursos da área de computação, uma vez que envolve a compreensão de conceitos abstratos, operações dinâmicas e formas específicas de organização da informação. Estruturas como pilhas, filas e listas encadeadas exigem que o estudante desenvolva modelos mentais capazes de representar inserções, remoções, buscas e mudanças de estado que nem sempre são facilmente compreendidas por meio de abordagens tradicionais. Nesse contexto, este trabalho teve como objetivo desenvolver e avaliar a Atloria, uma aplicação móvel educacional que utiliza realidade aumentada e gamificação para apoiar o ensino-aprendizagem de estruturas de dados. A solução foi planejada com base em revisão de literatura, elicitação e priorização de requisitos, modelagem de dados, definição arquitetural e construção de um protótipo funcional. A aplicação foi desenvolvida para dispositivos Android, integrando Flutter, SQLite, Unity e AR Foundation, e contempla recursos como autenticação, onboarding, salas temáticas, narrativas, mini missões, passaporte de conquistas, feedback imediato e visualização interativa em realidade aumentada. A experiência proposta organiza o aprendizado em uma jornada gamificada, na qual o usuário interage com representações visuais das estruturas de dados e acompanha sua progressão por meio de recompensas simbólicas e registros de desempenho. A validação incluiu testes técnicos, análise de qualidade, testes funcionais e avaliação com usuários, permitindo verificar o funcionamento das principais funcionalidades implementadas e coletar percepções sobre usabilidade, engajamento e aprendizagem. Os resultados indicaram uma avaliação positiva da experiência, especialmente quanto à organização visual, facilidade de uso e interesse gerado pelos elementos gamificados. Conclui-se que a integração entre realidade aumentada e gamificação apresenta potencial como recurso didático complementar para tornar o estudo de estruturas de dados mais visual, interativo e motivador.
      en: >-
        Learning data structures and algorithms is a recurring challenge in computing-related courses, as it requires the understanding of abstract concepts, dynamic operations, and specific ways of organizing information. Structures such as stacks, queues, and linked lists require students to develop mental models capable of representing insertions, removals, searches, and state changes that are not always easily understood through traditional teaching approaches. In this context, this undergraduate thesis aimed to develop and evaluate Atloria, an educational mobile application that uses augmented reality and gamification to support the teaching and learning of data structures. The solution was designed based on a literature review, requirements elicitation and prioritization, data modeling, architectural definition, and the construction of a functional prototype. The application was developed for Android devices, integrating Flutter, SQLite, Unity, and AR Foundation, and includes features such as authentication, onboarding, thematic rooms, narratives, mini missions, an achievement passport, immediate feedback, and interactive visualization through augmented reality. The proposed experience organizes learning as a gamified journey, in which users interact with visual representations of data structures and track their progress through symbolic rewards and performance records. The validation process included technical tests, software quality analysis, functional tests, and user evaluation, making it possible to verify the operation of the main implemented features and collect perceptions regarding usability, engagement, and learning. The results indicated a positive evaluation of the experience, especially regarding visual organization, ease of use, and the interest generated by the gamified elements. It is concluded that the integration of augmented reality and gamification has potential as a complementary didactic resource to make the study of data structures more visual, interactive, and motivating.
