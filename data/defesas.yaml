  - id: qualificacao-lucas-linard-2026
    type: qualification
    program: curso_ppca
    scheduled_date: '2026-06-30T00:00:00-03:00'
    held_date: '2026-06-30'
    title:
      pt: Improving Software Quality through Gamification Techniques
      en: Improving Software Quality through Gamification Techniques
    summary:
      pt: >-
        Grandes instituições financeiras adotam ferramentas de análise estática integradas a processos de governança de releases como mecanismo central de controle de qualidade de software. Evidências empíricas, contudo, mostram que essas ferramentas atuam como portões tardios de entrega e não como incentivos contínuos: no Banco do Brasil, organização investigada nesta pesquisa, uma observação longitudinal de um ano do ecossistema de desenvolvimento da baixa plataforma revela que a maioria dos projetos não reduz, nesse horizonte, seu inventário de issues não bloqueantes do SonarQube. Conduzido sob a estratégia de design science e instanciado como estudo de caso industrial, este trabalho propõe o Launch Center, uma camada gamificada de engajamento operada em nível de equipe e ancorada no framework Octalysis, que complementa o Release Engine institucional sem alterar seus controles formais de qualidade. O desenho é fundamentado por três fluxos convergentes de evidência: uma revisão sistemática da literatura no protocolo de Kitchenham, com 51 estudos primários incluídos; um diagnóstico institucional de qualidade de código apoiado em tendência anual de análise estática; e um perfil motivacional dos desenvolvedores, obtido por avaliação Octalysis com quatro juízes especialistas e por uma adaptação do Intrinsic Motivation Inventory (53 respostas válidas). O Launch Center materializa sete princípios de design, sete mecânicas cooperativas e três mecanismos de proteção em uma jornada de jogador organizada nas quatro fases do Octalysis Nível II, com ênfase nos core drives white-hat e em recompensas exclusivamente simbólicas. Como continuidade, propõe-se um protocolo de avaliação para um piloto controlado na organização, a ser executado em trabalho pós-qualificação como teste empírico da hipótese.
      en: >-
        Large financial institutions rely on automated static-analysis tooling integrated into release-governance pipelines as their central mechanism for controlling software quality. Empirical evidence, however, indicates that such tooling operates as a late-stage gate rather than as a continuous incentive: in the investigated organization, Banco do Brasil, a one-year longitudinal observation of the low-platform development ecosystem shows that the majority of projects fail to reduce their inventory of non-blocking SonarQube issues over that horizon. Framed as design-science research and instantiated as an industrial case study, this work proposes Launch Center, a team-level gamified engagement layer grounded in the Octalysis framework that complements the institutional Release Engine without altering its formal quality gates. The design is informed by three converging streams of evidence: a Kitchenham-style systematic literature review including 51 primary studies; an institutional code-quality baseline derived from a year-long static-analysis trend; and a motivational profile of the target developer population, obtained through a four-judge expert Octalysis assessment and an adapted Intrinsic Motivation Inventory survey (53 valid responses). Launch Center materializes seven design principles, seven cooperative game mechanics, and three protection mechanisms across a four-phase Octalysis Level II player journey, emphasizing white-hat motivational drives and exclusively symbolic rewards. The dissertation contributes the design artifact and a future evaluation protocol that operationalizes the hypothesis through a controlled pilot, to be executed as post-qualification work in the same industrial setting.
