  - id: luciano-junior-2026-06-11
    type: tcc
    program: curso_esw2
    scheduled_date: '2026-06-11T00:00:00-03:00'
    held_date: '2026-06-11'
    title:
      pt: Gamificação como estratégia de ensino da identificação de code smells
      en: Gamification as a Teaching Strategy for Code Smell Identification
    summary:
      pt: >-
        Este trabalho aborda a dificuldade recorrente de estudantes de programação em identificar code smells, um desafio que compromete a compreensão, a manutenção e a evolução de sistemas de software. O objetivo central é propor uma solução gamificada que apoie o aprendizado e torne o processo de detecção desses problemas mais acessível e motivador. A metodologia adotada segue uma abordagem qualitativa, com caráter exploratório, descritivo e aplicado, integrando pesquisa bibliográfica e estudo de caso. O percurso metodológico incluiu a análise contextual, a definição de perfis motivacionais, a ideação e prototipagem das mecânicas, seguida por testes de usabilidade, observação do uso da aplicação e registro das etapas e resultados obtidos. A plataforma proposta permitirá que estudantes pratiquem a identificação de code smells em cenários simulados, recebam feedback imediato e avancem em desafios progressivos.
      en: >-
        This paper addresses the recurring difficulty faced by programming students in identifying code smells, a challenge that affects the understanding, maintenance, and evolution of software systems. The main goal is to propose a gamified solution that supports learning and makes the detection of these issues more accessible and motivating. The methodology follows a qualitative approach with exploratory, descriptive, and applied characteristics, integrating bibliographic research and a case study. The methodological process included contextual analysis, definition of motivational profiles, ideation and prototyping of mechanics, followed by usability tests, observation of the application's use, and documentation of all stages and results. The proposed platform will allow students to practice identifying code smells in simulated scenarios, receive immediate feedback, and progress through incremental challenges.
