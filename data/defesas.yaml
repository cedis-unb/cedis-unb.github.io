  - id: pedro-carvalho-2014-11-17
    type: tcc
    program: curso_esw
    scheduled_date: '2014-11-17T00:00:00-03:00'
    held_date: '2014-11-17'
    title:
      pt: Sistema de buscas em ambiente virtual de aprendizagem baseada em perfis
      en: Search System in a Virtual Learning Environment Based on Profiles
    summary:
      pt: Este trabalho tem como objetivo a modelagem e a implementação da parte da busca de um ambiente virtual de aprendizagem, levando em consideração tanto o perfil de grupo do usuário que está 
        realizando a busca, quanto o seu perfil individual. Este tipo de modelagem da busca permite que sejam apresentados ao usuário, como resultado da busca, documentos mais próximos da sua 
        necessidade e portanto, mais relevantes para ele. Ao decorrer do trabalho é descrita a proposta do trabalho, bem como o processo de desenvolvimento adotado para o desenvolvimento do trabalho. 
        A metodologia utilizada para a realização do trabalho gira em torno de estudos em implementações já realizadas para a definição de perfil de grupo e perfil individual, além da composição 
        (integração) dessas implementações e da construção da busca associada a essa composição. Como resultado deste trabalho foi desenvolvido um ambiente capaz de apresentar páginas html com 
        conteúdos relevantes ao usuário, a partir de uma busca realizada por ele e baseada em seu perfil.
      en: This work aims to model and implement the search part of a virtual learning environment, taking into account both the group profile of the user performing the search and their individual 
        profile. This type of search modeling allows documents that are closer to the user's needs and therefore more relevant to them to be presented as search results. Throughout the work, the 
        proposal is described, as well as the development process adopted for the work. The methodology used for the work revolves around studies of already implemented solutions for defining group 
        profiles and individual profiles, in addition to composing (integrating) these implementations and building the search associated with this composition. As a result of this work, an 
        environment was developed capable of presenting HTML pages with content relevant to the user, based on a search performed by them and based on their profile.
    students:
