  - id: dione-moura-2025-01-10
    type: dissertation
    program: curso_ppca
    scheduled_date: '2025-01-10T00:00:00-03:00'
    held_date: '2025-01-10'
    title:
      pt: Proposição de Melhoria de Usabilidade da Interação entre Usuário e Sistema Corporativo do Exército Brasileiro
      en: Proposal for Improving the Usability of the Interaction Between User and Corporate System of the Brazilian Army
    summary:
      pt: 'O SiCaPEx, Sistema de Cadastramento de Pessoal do Exército, desempenha um papel essencial na gestão eficiente de informações para os processos de pessoal no Exército Brasileiro. Entretanto, ao
        longo do tempo, observou-se um aumento nas dificuldades operacionais e no desempenho do software, evidenciado pelo crescente número de pedidos de suporte relacionados à usabilidade do sistema. Este
        trabalho tem como objetivo analisar a usabilidade do SiCaPEx, examinando a interação entre os usuários e o sistema no período de 2019 a 2023, e propor melhorias com base nos resultados obtidos,
        implementando-as de forma prática. A gestão eficaz de pessoal no Exército depende diretamente da confiabilidade dos dados processados pelo SiCaPEx. A metodologia adotada incluiu uma abordagem quanti-qualitativa,
        que combinou pesquisa bibliográfica e análise documental para explorar os desafios de usabilidade enfrentados. A avaliação da usabilidade foi realizada por meio do questionário SUS (System Usability
        Scale) e da Avaliação Heurística de Nielsen, oferecendo uma visão abrangente das percepções dos usuários. Os dados coletados foram analisados estatisticamente com o uso de softwares especializados,
        como SPSS, R-Studio, Iramuteq e Excel. Os resultados apontaram problemas significativos de usabilidade no SiCaPEx. A pontuação global do questionário SUS ficou abaixo do esperado, evidenciando a
        necessidade de melhorias em áreas como facilidade de aprendizado, eficiência, memorização, minimização de erros e satisfação dos usuários. Esses problemas foram destacados pelos respondentes e validados
        pela análise dos dados. Com base nas sugestões de melhoria identificadas, foi elaborado um Memorando Interno e implementada uma FAQ (Frequency Answer the Question) para responder a dúvidas frequentes
        sobre o sistema, iniciativa que foi bem avaliada pelos usuários. Espera-se que os resultados desta pesquisa contribuam significativamente para uma gestão mais eficiente de pessoal, impactando diretamente
        as atividades administrativas e operacionais do Exército Brasileiro. '
      en: SiCaPEx, the Brazilian Army Personnel Registration System, plays an essential role in the efficient management of information for personnel processes in the Brazilian Army. However, over 
        time, an increase in operational difficulties and software performance has been observed, evidenced by the growing number of support requests related to the system's usability. This work aims 
        to analyze the usability of SiCaPEx, examining the interaction between users and the system from 2019 to 2023, and propose improvements based on the results obtained, implementing them in a 
        practical way. Effective personnel management in the Army directly depends on the reliability of the data processed by SiCaPEx. The methodology adopted included a quantitative-qualitative 
        approach, which combined bibliographic research and documentary analysis to explore the usability challenges faced. The usability assessment was carried out through the SUS (System Usability 
        Scale) questionnaire and Nielsen's Heuristic Evaluation, offering a comprehensive view of users' perceptions. The collected data were statistically analyzed using specialized software, such as
        SPSS, R-Studio, Iramuteq and Excel. The results indicated significant usability problems in SiCaPEx. The overall score of the SUS questionnaire was below expectations, highlighting the need 
        for improvements in areas such as ease of learning, efficiency, memorization, error minimization and user satisfaction. These problems were highlighted by the respondents and validated by data
        analysis. Based on the suggestions for improvement identified, an Internal Memorandum was prepared and a FAQ (Frequency Answer the Question) was implemented to answer frequently asked 
        questions about the system, an initiative that was well evaluated  by users. It is expected that the results of this research will contribute significantly to more efficient personnel 
        management, directly impacting the administrative and operational activities of the Brazilian Army.
