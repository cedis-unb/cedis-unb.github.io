  - id: tcc1-israel-santos-2026
    type: tcc1
    program: curso_esw2
    scheduled_date: '2026-07-04T00:00:00-03:00'
    held_date: '2026-07-04'
    title:
      pt: 'Gamificação e modelos de linguagem de grande escala: desenvolvimento de uma plataforma educacional'
      en: 'Gamification and Large Language Models: Development of an Educational Platform'
    summary:
      pt: >-
        Este trabalho propõe uma plataforma web gamificada para o ensino de conceitos fundamentais relacionados aos modelos de linguagem de grande escala (LLMs), visando tornar seu aprendizado mais acessível, envolvente e motivador. A fundamentação teórica aborda gamificação, o framework Octalysis, inteligência artificial, aprendizado de máquina, aprendizado profundo, processamento de linguagem natural e os impactos dos LLMs na Engenharia de Software. A pesquisa caracteriza-se como exploratória, de natureza aplicada, e foi desenvolvida por meio de revisão bibliográfica, levantamento do perfil motivacional do público-alvo com um questionário baseado no Octalysis, análise estatística dos dados utilizando o coeficiente Alfa de Cronbach e médias dos core drives, elicitação e priorização de requisitos e elaboração de um protótipo da solução. Os resultados evidenciaram elevada convergência entre os participantes quanto aos fatores motivacionais, identificando como predominantes os core drives de desenvolvimento e realização, significado épico e chamado, empoderamento da criatividade e feedback, e imprevisibilidade e curiosidade. Com base nesses achados, foram selecionadas dez técnicas de gamificação para compor a proposta da plataforma, organizada como uma jornada de exploração arqueológica voltada ao ensino de LLMs. Conclui-se que a utilização do framework Octalysis oferece uma base consistente para o desenvolvimento de ambientes educacionais gamificados, contribuindo para o engajamento dos estudantes e estabelecendo fundamentos para a implementação e avaliação da plataforma no TCC 2.
      en: >-
        This work proposes a gamified web platform for teaching fundamental concepts related to Large Language Models (LLMs), aiming to make their learning process more accessible, engaging, and motivating. The theoretical foundation covers gamification, the Octalysis framework, artificial intelligence, machine learning, deep learning, natural language processing, and the impact of LLMs on Software Engineering. This research is characterized as exploratory and applied in nature. It was conducted through a literature review, an assessment of the target audience's motivational profile using a questionnaire based on the Octalysis framework, statistical analysis of the collected data using Cronbach's alpha coefficient and core drive averages, requirements elicitation and prioritization, and the development of a prototype of the proposed solution. The results revealed a high degree of convergence among participants regarding motivational factors, identifying the predominant core drives as development and accomplishment, epic meaning and calling, empowerment of creativity and feedback, and unpredictability and curiosity. Based on these findings, ten gamification techniques were selected to compose the proposed platform, which is organized as an archaeological exploration journey for teaching LLM concepts. It is concluded that the Octalysis framework provides a solid foundation for the development of gamified educational environments, contributing to student engagement and establishing the basis for the implementation and evaluation of the platform in the second stage of the undergraduate thesis.
