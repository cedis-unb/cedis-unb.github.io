  - id: tcc1-henrique-marina-2026
    type: tcc1
    program: curso_esw2
    scheduled_date: '2026-07-04T00:00:00-03:00'
    held_date: '2026-07-04'
    title:
      pt: Sistema de Detecção de Intrusões com Aprendizado de Máquina
      en: Intrusion Detection System with Machine Learning
    summary:
      pt: >-
        O aumento do volume e da complexidade dos ataques cibernéticos torna necessária a adoção de mecanismos que auxiliem o monitoramento e a análise de eventos de segurança em redes de computadores. Sistemas de Detecção de Intrusões podem identificar atividades suspeitas, porém a grande quantidade de alertas gerados pode dificultar a análise manual e aumentar a ocorrência de falsos positivos. Neste contexto, este trabalho propõe um Sistema de Detecção de Intrusões com Aprendizado de Máquina, integrando o Suricata, o algoritmo Random Forest e uma interface gráfica para apoio à análise de alertas. A proposta prevê o monitoramento de logs do Suricata, o processamento dos eventos por um modelo de classificação, a apresentação do veredito e do nível de confiança para cada alerta, além do armazenamento de histórico, filtros, dashboard e recursos de configuração. Para os experimentos iniciais, foi utilizada uma versão em formato CSV do dataset CSE-CIC-IDS2018, contendo fluxos de rede rotulados. Os dados foram submetidos a etapas de limpeza, conversão de atributos, definição da variável alvo e divisão entre conjuntos de treinamento e teste. O modelo Random Forest foi selecionado por sua robustez, capacidade de lidar com múltiplos atributos e possibilidade de analisar a importância das features. Como resultados preliminares, foram definidos os requisitos da solução, elaborada a arquitetura lógica do sistema, realizado o treinamento inicial do modelo e desenvolvidos protótipos de interface no Figma. Espera-se que a continuidade do projeto permita integrar os componentes em uma aplicação funcional, contribuindo para tornar a análise de alertas mais organizada, acessível e eficiente.
      en: >-
        The increasing volume and complexity of cyberattacks make it necessary to adopt mechanisms that support the monitoring and analysis of security events in computer networks. Intrusion Detection Systems can identify suspicious activities; however, the large number of generated alerts may hinder manual analysis and increase the occurrence of false positives. In this context, this work proposes an Intrusion Detection System with Machine Learning, integrating Suricata, the Random Forest algorithm, and a graphical interface to support alert analysis. The proposed solution includes Suricata log monitoring, event processing through a classification model, presentation of the verdict and confidence level for each alert, as well as history storage, filters, dashboards, and configuration features. For the initial experiments, a CSV version of the CSE-CIC-IDS2018 dataset containing labeled network flows was used. The data underwent cleaning, attribute conversion, target variable definition, and division between training and testing sets. The Random Forest model was selected due to its robustness, ability to handle multiple attributes, and capability to analyze feature importance. As preliminary results, the system requirements were defined, the logical architecture was designed, the initial model training was performed, and interface prototypes were developed in Figma. It is expected that the continuation of the project will integrate these components into a functional application, contributing to a more organized, accessible, and efficient alert analysis process.
