  - id: italo-guimaraes-2023-07-24
    type: tcc
    program: curso_esw
    scheduled_date: '2023-07-24T00:00:00-03:00'
    held_date: '2023-07-24'
    title:
      pt: Implementação de um aplicativo de apoio para a disciplina gamificada em IHC
      en: Implementation of a support application for the gamified course in HCI
    summary:
      pt: "O presente trabalho tem como objetivo apresentar a implementação de um aplicativo para a disciplina gamificada de Interação Humano-Computador na Universidade de Brasília(UnB). A gamificação é
        uma abordagem que utiliza elementos de jogos para engajar e motivar os alunos em seu processo de aprendizagem. O aplicativo desenvolvido visa complementar a experiência da disciplina de IHC, oferecendo
        recursos e funcionalidades gamificadas que promovam a participação ativa dos alunos. Para alcançar esse objetivo, foram utilizados métodos e conceitos da Engenharia de Software, que incluiu o estudo
        da literatura relevante aos RPG\x92s e ao framework Octalysis, a coleta de requisitos, bem comoo Scrum. Neste trabalho, é apresentado o levantamento de requisitos, sua priorização e as especificações
        técnicas do sistema que foi implementado no Trabalho de Conclusão de Curso 2. Além disso, é apresentada a arquitetura de desenvolvimento que define as tecnologias e o ambiente em que foi desenvolvido
        o sistema, um teste de conceito que inclui o protótipo das telas do sistema com algumas das funcionalidades na tecnologia utilizada, e a modelagem relacional das entidades e dados. Por fim, é apresentada
        a implementação do aplicativo, com um resumo do desenvolvimento e a conclusão obtida."
      en: This project aims to present the implementation of an application for the gamified discipline of Human-Computer Interaction at the University of Brasília (UnB). Gamificationis an approach 
        that uses game elements to engage and motivate students in their learning process. The developed application aims to complement the experience of the HCIdiscipline by offering gamified 
        features and functionalities that promote active student participation. To achieve this goal, methods and concepts from Software Engineering were employed, including the study of relevant 
        literature on RPGs and the Octalysisframework, requirements gathering, as well as Scrum. This project presents the requirements elicitation, prioritization, and technical specifications of the
        system implemented inthe Final Project 2. Additionally, the development architecture defining the technologiesand environment in which the system was developed is presented, along with a 
        proof-ofconcept including the prototype screens with some of the functionalities using the chosentechnology, and the relational modeling of entities and data. Finally, the implementationof the
        application is presented, along with a summary of the development process and the conclusion obtained.
