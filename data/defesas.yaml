  - id: ana-beatriz-2026-07-14
    type: tcc
    program: curso_esw2
    scheduled_date: '2026-07-14T00:00:00-03:00'
    held_date: '2026-07-14'
    title:
      pt: 'Git Ranking: Desenvolvimento de uma aplicação gamificada de gestão e motivação de equipes ágeis para o GitHub App'
      en: 'Git Ranking: Developing a Gamified Application for Managing and Motivating Agile Teams as a GitHub App'
    summary:
      pt: >-
        O presente trabalho aborda os desafios enfrentados por equipes de desenvolvimento de software em manter o engajamento contínuo e a visibilidade do progresso individual dentro de metodologias ágeis. O objetivo principal é desenvolver uma ferramenta gamificada de apoio ao Scrum, concebida como um GitHub App integrado para gestão e motivação de equipes, integrando elementos do framework Octalysis para equilibrar motivadores intrínsecos e extrínsecos. A metodologia adotada classifica-se como aplicada e exploratória, com abordagem mista. O processo metodológico incluiu a identificação do perfil motivacional dos usuários através do Inventário de Motivação Intrínseca (IMI), correlacionando-o aos Core Drives do Octalysis, e a seleção de técnicas de gamificação via Técnica de Juízes. Como resultados, o trabalho apresenta a especificação dos requisitos funcionais priorizados pelo método MoSCoW, a arquitetura da solução baseada no consumo de Webhooks do GitHub processados via backend Node.js e apresentados em uma interface React/Next.js. Foram desenvolvidos protótipos de alta fidelidade que materializam a proposta, focando em um dashboard de métricas e perfil de conquistas com elementos de gamificação, como insígnias, barras de progresso e feedback visual contínuo baseado nas ações reais dos desenvolvedores nos repositórios. O estudo conclui a etapa de planejamento e design da solução, estabelecendo as bases para a implementação e validação que ocorrerão na próxima fase do projeto.
      en: >-
        This work addresses the challenges faced by software development teams in maintaining continuous engagement and the visibility of individual progress within agile methodologies. The main objective is to develop a gamified tool to support Scrum, designed as an integrated GitHub App for team management and motivation, integrating elements of the Octalysis framework to balance intrinsic and extrinsic motivators. The adopted methodology is classified as applied and exploratory, with a mixed approach. The methodological process included identifying the users' motivational profile through the Intrinsic Motivation Inventory (IMI), correlating it to the Core Drives of Octalysis, and selecting gamification techniques via the Judges' Technique. As results, the work presents the specification of functional requirements prioritized by the MoSCoW method, the solution architecture based on the consumption of GitHub Webhooks processed via a Node.js backend and presented in a React/Next.js interface. High-fidelity prototypes were developed to materialize the proposal, focusing on a metrics dashboard and achievements profile with gamification elements, such as badges, progress bars, and continuous visual feedback based on the actual actions of developers in the repositories. The study concludes the planning and design stage of the solution, establishing the foundations for the implementation and validation that will occur in the next phase of the project.
