  - id: tcc1-ian-christian-2026
    type: tcc1
    program: curso_esw2
    scheduled_date: '2026-07-11T00:00:00-03:00'
    held_date: '2026-07-11'
    title:
      pt: 'IA aplicada à Engenharia de Software: Uma análise das transformações causadas pela IA à Engenharia de Software nas atividades de desenvolvimento'
      en: 'AI applied to Software Engineering: An analysis of the transformations caused by AI in Software Engineering development activities'
    summary:
      pt: >-
        A crescente adoção de ferramentas de Inteligência Artificial (IA) Generativa no desenvolvimento de software levanta questões relevantes sobre seus impactos na qualidade do código produzido, na produtividade dos desenvolvedores e no processo de aprendizagem dos estudantes, especialmente diante da ausência de diretrizes consolidadas sobre seu uso em contextos acadêmicos. Este trabalho apresenta o planejamento de um estudo laboratorial controlado com o objetivo de investigar esses impactos no desenvolvimento realizado por estudantes e egressos do curso de Engenharia de Software da Universidade de Brasília (UnB). A metodologia se estrutura em três etapas: recrutamento, exercício de programação e questionário final. Os participantes são divididos aleatoriamente em dois grupos experimentais, um com uso obrigatório de ferramentas de IA e outro sem acesso a esse recurso, e ambos realizam a mesma atividade utilizando a biblioteca React. A coleta de dados combina métricas objetivas de qualidade de código, como linhas de código (LOC), saúde do código, erros de lint e tempo de execução, com métricas subjetivas de natureza psicológica, incluindo satisfação, utilidade percebida, autoeficácia, emoções positivas e disposição para aprendizagem autônoma, mensuradas por meio de questionários em escala de Likert. O planejamento é estruturado com base no modelo Goal-Question-Metric (GQM) e inspirado nas diretrizes do ACM SIGSOFT Empirical Standard for Experiments with Human Participants. Espera-se que os resultados contribuam para a compreensão dos benefícios e limitações do uso da IA Generativa em contextos educacionais, fornecendo evidências que auxiliem pesquisadores, docentes e instituições de ensino na adoção consciente dessas tecnologias.
      en: >-
        The growing adoption of Generative Artificial Intelligence (AI) tools in software development raises relevant questions about their impacts on code quality, developer productivity, and student learning, especially given the absence of consolidated guidelines on their use in academic contexts. This work presents the planning of a controlled laboratory study aimed at investigating these impacts on the development process carried out by students and graduates of the Software Engineering program at the University of Brasília (UnB). The methodology is structured in three stages: recruitment, programming exercise, and final questionnaire. Participants are randomly divided into two experimental groups, one required to use AI tools and another without access to such resources, and both perform the same activity using the React library. Data collection combines objective code quality metrics, such as lines of code (LOC), code health, lint errors, and execution time, with subjective psychological metrics, including satisfaction, perceived usefulness, self-efficacy, positive emotions, and autonomous learning disposition, measured through Likert scale questionnaires. The planning is structured based on the Goal-Question-Metric (GQM) model and inspired by the guidelines of the ACM SIGSOFT Empirical Standard for Experiments with Human Participants. The results are expected to contribute to the understanding of the benefits and limitations of Generative AI in educational contexts, providing evidence to support researchers, educators, and academic institutions in the conscious adoption of these technologies.
