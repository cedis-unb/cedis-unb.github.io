      - cristiane_ramos    # áreas 4; projetos octaanalysis,a3m,cc,framework_preditivo_engajamento,inovacao_digital_gamificacao; defesas 9
      - george_marsicano   # áreas 5; projetos inovacao_digital_gamificacao,super_r; defesas 12
