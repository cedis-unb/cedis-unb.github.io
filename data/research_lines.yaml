  - id: line_secure_scalable_systems
    slug: computing-systems
    status: active
    name:
      pt: "Sistemas computacionais: segurança, desempenho e sustentabilidade"
      en: "Computing systems: security, performance, and sustainability"
    summary:
      pt: "Segurança, desempenho, escalabilidade e sustentabilidade de sistemas computacionais, da infraestrutura em nuvem ao software verde."
      en: "Security, performance, scalability, and sustainability of computing systems, from cloud infrastructure to green software."
    description:
      pt: |
        A linha trata das propriedades de infraestrutura que tornam sistemas confiáveis em escala: segurança da informação e fatores humanos em segurança, arquiteturas em nuvem e serverless, processamento paralelo e massivo de dados, desempenho e escalabilidade, e sustentabilidade computacional, incluindo o consumo de energia do software. Os projetos combinam pesquisa em desempenho com aplicações reais em órgãos públicos e em plataformas do próprio centro.
      en: |
        This line addresses the infrastructure properties that make systems reliable at scale: information security and human factors in security, cloud and serverless architectures, parallel and massive data processing, performance and scalability, and computational sustainability, including software energy consumption. Projects combine performance research with real applications in public agencies and in the center's own platforms.
    questions:
      pt:
        - "Como arquiteturas em nuvem e serverless reduzem custo e tempo de processamento em cargas científicas?"
        - "Que fatores humanos explicam falhas de segurança em organizações e como mitigá-los?"
        - "Como medir e reduzir o custo energético e ambiental de sistemas de software?"
      en:
        - "How do cloud and serverless architectures reduce cost and processing time for scientific workloads?"
        - "Which human factors explain security failures in organizations and how can they be mitigated?"
        - "How can the energy and environmental cost of software systems be measured and reduced?"
    methods:
      pt: ["Benchmarks de desempenho", "Experimentos em infraestrutura de nuvem", "Surveys e estudos com usuários", "Análise de incidentes", "Medição de consumo de energia de software"]
      en: ["Performance benchmarks", "Cloud infrastructure experiments", "Surveys and user studies", "Incident analysis", "Software energy consumption measurement"]
    areas:
      - security
      - hpc
      - green_software
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
