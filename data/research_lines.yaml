      - sergio_freitas     # áreas 1; defesas 11
      - george_marsicano   # áreas 1; defesas 4
      - fabiana_mendes     # áreas 1; projetos gsd; defesas 2
    projects:
      - project_laguna
      - project_nimbus
      - project_mcti_gestao
      - project_servicos_pi
      - project_gsd
    themes:
      - id: cloud_computing
        name: { pt: "Computação em nuvem", en: "Cloud computing" }
      - id: serverless
        name: { pt: "Arquiteturas serverless", en: "Serverless architectures" }
      - id: parallel_processing
