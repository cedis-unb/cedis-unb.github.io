# Linhas de pesquisa do CEDIS — fonte canônica.
#
# Camada institucional distinta de data/areas.yaml:
#   · Áreas de atuação (areas.yaml)  = competências e frentes do centro (o que o CEDIS sabe fazer).
#   · Linhas de pesquisa (este arquivo) = programas científicos no sentido do CNPq/DGP
#     (temas aglutinadores com tradição investigativa, dos quais derivam projetos).
#
# Relações são todas muitos-para-muitos e EXPLÍCITAS. Nada é deduzido de areas.yaml.
#   areas[]       ids de data/areas.yaml
#   researchers[] slugs de content/people/<slug>.md (perfis com profile_level: researcher)
#   projects[]    ids de data/projects.yaml
#   themes[]      temas/palavras-chave da linha; cada item tem id (slug) e name pt/en.
#                 O id vira chave i18n e, se existir tag homônima, a linha liga à taxonomia.
#   history       histórico institucional da linha (opcional, markdown pt/en)
#
# status: draft | active | archived
#   draft    — não renderiza, não entra em menu, sitemap, busca nem relações inversas.
#   active   — publicada; aparece em Pesquisa › Linhas de pesquisa, no mapa e nas
#              relações inversas (área, pesquisador, projeto).
#   archived — página mantida com selo "arquivada", listada em "Linhas anteriores";
#              fora do menu, do mapa e das relações inversas.
#
# Regras validadas por scripts/validate_content.py:
#   · id único (^line_[a-z0-9_]+$), slug único (^[a-z0-9-]+$);
#   · todas as referências devem existir nas fontes canônicas;
#   · linha active exige >= 1 área e >= 1 pesquisador (aviso se sem projetos).
#
# Após editar: python3 scripts/build_research_lines.py && python3 scripts/update_i18n.py
# Documentação: docs-src/research-lines.md
#
# ---------------------------------------------------------------------------
# ESTADO ATUAL (2026-09-12): as cinco linhas abaixo estão ATIVAS (publicadas), por
# decisão de Sergio após a revisão de nomes e escopos frente ao conceito de linha do
# DGP/CNPq e ao Documento de Área de Computação da CAPES (análise de 2026-09-12):
#   · "impacto social" é dimensão transversal do CEDIS, não objeto de linha;
#   · linhas 1 e 3 agregam/evoluem linhas que o grupo já registrava na UnB (SIGAA,
#     2021–atual): VV&T, Arquitetura de Software, Engenharia de Linhas de Produto e
#     "Ciência da Aprendizagem, Serious Games e Gamificação" — ver campo `history`.
# Pendência registrada: alinhar o registro do grupo no DGP/CNPq a estas cinco linhas.
# `researchers` contém apenas vínculos declarados explicitamente por Sergio (2026-09-12),
# nunca deduzidos automaticamente; cada um traz comentário com a evidência (áreas da
# linha, projetos vinculados, defesas). Regra adotada: quem participa de projeto
# vinculado à linha pertence à linha. `projects` e `themes` também aguardam validação.
# ---------------------------------------------------------------------------

section:
  title:
    pt: "Linhas de pesquisa"
    en: "Research lines"
  description:
    pt: "Programas científicos do CEDIS: temas aglutinadores que articulam áreas de atuação, pesquisadores, projetos e produção com uma agenda investigativa própria."
    en: "CEDIS scientific programs: unifying themes that bring together areas of expertise, researchers, projects, and output under a shared research agenda."

research_lines:


  - id: line_software_engineering
    slug: software-engineering
    status: active
    name:
      pt: "Engenharia, evolução e qualidade de software"
      en: "Software engineering, evolution, and quality"
    summary:
      pt: "Como projetar, construir, avaliar, manter e evoluir sistemas de software com qualidade, previsibilidade e sustentabilidade."
      en: "How to design, build, assess, maintain, and evolve software systems with quality, predictability, and sustainability."
    description:
      pt: |
        A linha reúne a tradição do CEDIS em engenharia de software: arquitetura e linhas de produto, engenharia de requisitos, qualidade, verificação, validação e testes, e a parcela de desenvolvimento sustentável de software ligada ao processo. O foco está em métodos, modelos e ferramentas que tornem a construção e a evolução de software mais previsíveis e o produto mais confiável ao longo de sua vida.

        Os projetos da linha nascem tanto de demandas de organizações parceiras quanto de questões abertas na literatura, e alimentam disciplinas de graduação e pós-graduação em Engenharia de Software.
      en: |
        This line gathers CEDIS's tradition in software engineering: architecture and product lines, requirements engineering, quality, verification, validation and testing, and the process-related share of sustainable software development. The focus is on methods, models, and tools that make building and evolving software more predictable and the product more reliable over its lifetime.

        Projects in this line arise both from partner organizations' needs and from open questions in the literature, and feed undergraduate and graduate courses in Software Engineering.
    questions:
      pt:
        - "Como avaliar e evoluir arquiteturas de software em sistemas de longa vida?"
        - "Que práticas de requisitos e qualidade reduzem retrabalho em equipes pequenas e médias?"
        - "Como manter e evoluir software sem degradar qualidade, testabilidade e manutenibilidade?"
      en:
        - "How can software architectures be assessed and evolved in long-lived systems?"
        - "Which requirements and quality practices reduce rework in small and medium teams?"
        - "How can software be maintained and evolved without degrading quality, testability, and maintainability?"
    methods:
      pt: ["Estudos de caso", "Experimentos controlados", "Revisões sistemáticas", "Pesquisa-ação com organizações parceiras"]
      en: ["Case studies", "Controlled experiments", "Systematic reviews", "Action research with partner organizations"]
    history:
      pt: "Agrega e atualiza três linhas que o grupo já registrava institucionalmente na UnB (SIGAA, 2021–atual): Verificação, Validação e Testes; Arquitetura de Software; e Engenharia de Linhas de Produto de Software. Corresponde à subárea Engenharia de Software da Tabela de Áreas do CNPq."
      en: "Aggregates and updates three lines the group already registered institutionally at UnB (SIGAA, 2021–present): Verification, Validation and Testing; Software Architecture; and Software Product Line Engineering. It corresponds to the Software Engineering sub-area of the CNPq Knowledge Areas Table."
    areas:
      - esw
      - software_architecture
      - software_requirements
      - software_quality
      - software_product_line
      - verification_validation_testing
      - green_software
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
      - andre_lanna        # áreas 3; projetos lfs; defesas 15
      - fabiana_mendes     # áreas 2; projetos gsd; defesas 15
      - cristiane_ramos    # áreas 3; defesas 13
      - george_marsicano   # áreas 2; defesas 11
      - ricardo_ajax       # áreas 3; defesas 4
      - sergio_freitas     # áreas 1; defesas 9
    projects:
      - project_lfs
      - project_gsd
    themes:
      - id: software_process
        name: { pt: "Processos de software", en: "Software processes" }
      - id: software_metrics
        name: { pt: "Métricas de software", en: "Software metrics" }
      - id: technical_debt
        name: { pt: "Dívida técnica", en: "Technical debt" }
      - id: software_evolution
        name: { pt: "Evolução de software", en: "Software evolution" }
      - id: sustainable_software
        name: { pt: "Software sustentável", en: "Sustainable software" }

  - id: line_ai_language_data
    slug: ai-language-data-science
    status: active
    name:
      pt: "Inteligência artificial, processamento de linguagem e ciência de dados"
      en: "Artificial intelligence, language processing, and data science"
    summary:
      pt: "Aprendizado de máquina, processamento de linguagem natural e ciência de dados aplicados à recuperação de informação, à ciência e à gestão pública."
      en: "Machine learning, natural language processing, and data science applied to information retrieval, science, and public management."
    description:
      pt: |
        A linha investiga como técnicas de inteligência artificial, sobretudo aprendizado de máquina, modelos de linguagem e ciência de dados, podem organizar, recuperar e interpretar grandes volumes de informação textual, científica e institucional. Inclui plataformas de apoio à revisão de literatura, mineração de repositórios, modelos preditivos e sistemas de apoio à decisão para órgãos públicos.

        Os resultados se materializam em produtos como Contextus e Evidentia e em projetos com parceiros como IBICT, MCTI e INPI. O CEDIS integra o Centro Integrado de Pesquisa em Inteligência Artificial da UnB (CenIA).
      en: |
        This line investigates how artificial intelligence techniques, especially machine learning, language models, and data science, can organize, retrieve, and interpret large volumes of textual, scientific, and institutional information. It includes literature-review support platforms, repository mining, predictive models, and decision-support systems for public agencies.

        Results materialize in products such as Contextus and Evidentia and in projects with partners such as IBICT, MCTI, and INPI. CEDIS is part of UnB's Integrated Research Center in Artificial Intelligence (CenIA).
    questions:
      pt:
        - "Como modelos de linguagem podem apoiar a revisão sistemática e a curadoria de evidências científicas?"
        - "Que representações de dados tornam a recuperação de informação técnica mais precisa e explicável?"
        - "Como integrar aprendizado de máquina e ciência de dados a fluxos de trabalho de instituições públicas com segurança e transparência?"
      en:
        - "How can language models support systematic reviews and the curation of scientific evidence?"
        - "Which data representations make technical information retrieval more accurate and explainable?"
        - "How can machine learning and data science be integrated into public institutions' workflows safely and transparently?"
    methods:
      pt: ["Experimentos com modelos de aprendizado de máquina", "Avaliação de sistemas de recuperação de informação", "Prototipação com parceiros", "Análise de dados institucionais"]
      en: ["Experiments with machine learning models", "Evaluation of information retrieval systems", "Prototyping with partners", "Institutional data analysis"]
    areas:
      - ai
      - machine_learning
      - nlp
      - learning_analytics
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
      - sergio_freitas     # áreas 4; projetos dfcris,evidentia,ia_dados_transformacao_digital,framework_preditivo_engajamento; defesas 18
      - george_marsicano   # projetos evidentia,ia_dados_transformacao_digital; defesas 7
      - daniel_sundfeld    # projetos mcti_gestao,servicos_pi; defesas 3
      - andre_lanna        # projetos dfcris,ia_dados_transformacao_digital; defesas 3
      - cristiane_ramos    # áreas 1; projetos framework_preditivo_engajamento; defesas 4
    projects:
      - dfcris
      - evidentia
      - project_ia_dados_transformacao_digital
      - project_mcti_gestao
      - project_servicos_pi
      - project_framework_preditivo_engajamento
    themes:
      - id: large_language_models
        name: { pt: "Grandes modelos de linguagem", en: "Large language models" }
      - id: text_mining
        name: { pt: "Mineração de texto", en: "Text mining" }
      - id: scientific_information_retrieval
        name: { pt: "Recuperação de informação científica", en: "Scientific information retrieval" }
      - id: predictive_models
        name: { pt: "Modelos preditivos", en: "Predictive models" }
      - id: data_science
