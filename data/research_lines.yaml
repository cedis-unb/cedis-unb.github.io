  - id: line_digital_transformation
    slug: digital-transformation
    status: draft
    name:
      pt: "Transformação digital e sistemas sociotécnicos"
      en: "Digital transformation and sociotechnical systems"
    summary:
      pt: "Design e construção de serviços digitais e de software social com impacto em organizações públicas e na sociedade."
      en: "Design and construction of digital services and social software with impact on public organizations and society."
    description:
      pt: |
        A linha investiga a transformação digital como fenômeno sociotécnico: serviços públicos digitais, metodologias colaborativas de design e software desenvolvido para gerar impacto social positivo sem fins comerciais. Reúne o programa Software para o Bem, projetos com órgãos públicos e a produção sobre experiência do usuário e engenharia de requisitos aplicada.

        Os resultados vão de aplicativos gratuitos para ONGs e escolas a metodologias adotadas por órgãos federais.
      en: |
        This line investigates digital transformation as a sociotechnical phenomenon: digital public services, collaborative design methodologies, and software built to generate positive social impact without commercial purpose. It gathers the Software for Good program, projects with public agencies, and output on user experience and applied requirements engineering.

        Results range from free applications for NGOs and schools to methodologies adopted by federal agencies.
    questions:
      pt:
        - "Como desenhar serviços públicos digitais centrados no cidadão com equipes multidisciplinares?"
        - "Que modelos de desenvolvimento voluntário e universitário sustentam software social ao longo do tempo?"
        - "Como medir o impacto social de soluções digitais gratuitas?"
      en:
        - "How can citizen-centered digital public services be designed with multidisciplinary teams?"
        - "Which volunteer and university development models sustain social software over time?"
        - "How can the social impact of free digital solutions be measured?"
    methods:
      pt: ["Design de serviços", "Pesquisa-ação", "Estudos de caso com organizações públicas e sociais", "Avaliação de usabilidade"]
      en: ["Service design", "Action research", "Case studies with public and social organizations", "Usability evaluation"]
    areas:
