  - id: line_digital_transformation
    slug: sociotechnical-systems
    status: active
    name:
      pt: "Sistemas sociotécnicos e transformação digital"
      en: "Sociotechnical systems and digital transformation"
    summary:
      pt: "Design, construção e avaliação de sistemas sociotécnicos, serviços digitais e processos em organizações públicas e sociais."
      en: "Design, construction, and evaluation of sociotechnical systems, digital services, and processes in public and social organizations."
    description:
      pt: |
        A linha investiga a transformação digital como fenômeno sociotécnico: serviços públicos e governo digital, metodologias colaborativas de design de serviços, transformação de processos organizacionais, DevOps em organizações e sistemas de informação organizacionais. O software social, com o programa Software para o Bem, é uma de suas frentes; o impacto social é uma dimensão transversal de todo o CEDIS, não o objeto que define esta linha.

        Os resultados vão de metodologias adotadas por órgãos federais a aplicativos gratuitos para ONGs e escolas.
      en: |
        This line investigates digital transformation as a sociotechnical phenomenon: public services and digital government, collaborative service-design methodologies, organizational process transformation, DevOps in organizations, and organizational information systems. Social software, through the Software for Good program, is one of its fronts; social impact is a cross-cutting dimension of all of CEDIS, not the object that defines this line.

        Results range from methodologies adopted by federal agencies to free applications for NGOs and schools.
    questions:
      pt:
        - "Como desenhar serviços públicos digitais centrados no cidadão com equipes multidisciplinares?"
        - "Que arranjos sociotécnicos sustentam a transformação de processos em organizações públicas?"
        - "Que modelos de desenvolvimento voluntário e universitário sustentam software social ao longo do tempo?"
      en:
        - "How can citizen-centered digital public services be designed with multidisciplinary teams?"
        - "Which sociotechnical arrangements sustain process transformation in public organizations?"
        - "Which volunteer and university development models sustain social software over time?"
    methods:
      pt: ["Design de serviços", "Pesquisa-ação", "Estudos de caso com organizações públicas e sociais", "Avaliação de usabilidade"]
      en: ["Service design", "Action research", "Case studies with public and social organizations", "Usability evaluation"]
    areas:
