      - cristiane_ramos    # áreas 3; defesas 13
      - george_marsicano   # áreas 2; defesas 11
      - ricardo_ajax       # áreas 3; defesas 4
      - sergio_freitas     # áreas 1; defesas 9
    projects:
      - project_lfs
      - project_gsd
    themes:
      - id: software_process
        name: { pt: "Processos de software", en: "Software processes" }
      - id: software_metrics
        name: { pt: "Métricas de software", en: "Software metrics" }
      - id: technical_debt
        name: { pt: "Dívida técnica", en: "Technical debt" }
      - id: sustainable_software
        name: { pt: "Software sustentável", en: "Sustainable software" }

  - id: line_ai_language_data
    slug: ai-language-data
    status: draft
    name:
      pt: "Inteligência artificial, linguagem e análise de dados"
      en: "Artificial intelligence, language, and data analysis"
    summary:
      pt: "Modelos de aprendizado de máquina e processamento de linguagem natural aplicados à recuperação de informação, à ciência e à gestão pública."
      en: "Machine learning and natural language processing models applied to information retrieval, science, and public management."
    description:
      pt: |
        A linha investiga como técnicas de inteligência artificial, sobretudo aprendizado de máquina e processamento de linguagem natural, podem organizar, recuperar e interpretar grandes volumes de informação textual e científica. Inclui plataformas de apoio à revisão de literatura, mineração de repositórios institucionais e sistemas de apoio à decisão para órgãos públicos.

        Os resultados se materializam em produtos como Contextus e Evidentia e em projetos com parceiros como IBICT, MCTI e INPI.
      en: |
        This line investigates how artificial intelligence techniques, especially machine learning and natural language processing, can organize, retrieve, and interpret large volumes of textual and scientific information. It includes literature-review support platforms, institutional repository mining, and decision-support systems for public agencies.

        Results materialize in products such as Contextus and Evidentia and in projects with partners such as IBICT, MCTI, and INPI.
    questions:
      pt:
        - "Como modelos de linguagem podem apoiar a revisão sistemática e a curadoria de evidências científicas?"
        - "Que representações de dados tornam a recuperação de informação técnica mais precisa e explicável?"
        - "Como integrar aprendizado de máquina a fluxos de trabalho de instituições públicas com segurança e transparência?"
      en:
        - "How can language models support systematic reviews and the curation of scientific evidence?"
        - "Which data representations make technical information retrieval more accurate and explainable?"
        - "How can machine learning be integrated into public institutions' workflows safely and transparently?"
    methods:
      pt: ["Experimentos com modelos de aprendizado de máquina", "Avaliação de sistemas de recuperação de informação", "Prototipação com parceiros", "Análise de dados institucionais"]
      en: ["Experiments with machine learning models", "Evaluation of information retrieval systems", "Prototyping with partners", "Institutional data analysis"]
    areas:
      - ai
      - machine_learning
      - nlp
      - learning_analytics
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
      - sergio_freitas     # áreas 4; projetos dfcris,evidentia,framework_preditivo_engajamento,ia_dados_transformacao_digital; defesas 18
      - george_marsicano   # projetos evidentia,ia_dados_transformacao_digital; defesas 7
      - daniel_sundfeld    # projetos mcti_gestao,servicos_pi; defesas 3
      - andre_lanna        # projetos dfcris,ia_dados_transformacao_digital; defesas 3
      - cristiane_ramos    # áreas 1; projetos framework_preditivo_engajamento; defesas 4
    projects:
      - dfcris
      - evidentia
      - project_ia_dados_transformacao_digital
      - project_mcti_gestao
      - project_servicos_pi
      - project_framework_preditivo_engajamento
    themes:
      - id: large_language_models
        name: { pt: "Grandes modelos de linguagem", en: "Large language models" }
      - id: text_mining
        name: { pt: "Mineração de texto", en: "Text mining" }
      - id: scientific_information_retrieval
        name: { pt: "Recuperação de informação científica", en: "Scientific information retrieval" }
