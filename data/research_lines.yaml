# Linhas de pesquisa do CEDIS — fonte canônica.
#
# Camada institucional distinta de data/areas.yaml:
#   · Áreas de atuação (areas.yaml)  = competências e frentes do centro (o que o CEDIS sabe fazer).
#   · Linhas de pesquisa (este arquivo) = programas científicos no sentido do CNPq/DGP
#     (temas aglutinadores com tradição investigativa, dos quais derivam projetos).
#
# Relações são todas muitos-para-muitos e EXPLÍCITAS. Nada é deduzido de areas.yaml.
#   areas[]       ids de data/areas.yaml
#   researchers[] slugs de content/people/<slug>.md (perfis com profile_level: researcher)
#   projects[]    ids de data/projects.yaml
#   themes[]      temas/palavras-chave da linha; cada item tem id (slug) e name pt/en.
#                 O id vira chave i18n e, se existir tag homônima, a linha liga à taxonomia.
#
# status: draft | active | archived
#   draft    — não renderiza, não entra em menu, sitemap, busca nem relações inversas.
#   active   — publicada; aparece em Pesquisa › Linhas de pesquisa, no mapa e nas
#              relações inversas (área, pesquisador, projeto).
#   archived — página mantida com selo "arquivada", listada em "Linhas anteriores";
#              fora do menu, do mapa e das relações inversas.
#
# Regras validadas por scripts/validate_content.py:
#   · id único (^line_[a-z0-9_]+$), slug único (^[a-z0-9-]+$);
#   · todas as referências devem existir nas fontes canônicas;
#   · linha active exige >= 1 área e >= 1 pesquisador (aviso se sem projetos).
#
# Após editar: python3 scripts/build_research_lines.py && python3 scripts/update_i18n.py
# Documentação: docs-src/research-lines.md
#
# ---------------------------------------------------------------------------
# ESTADO ATUAL (2026-09-12): as cinco linhas abaixo são RASCUNHO (status: draft),
# proposta de reorganização a ser confrontada com as linhas registradas pelo grupo
# no DGP/CNPq e validada pelos pesquisadores. `researchers` contém apenas vínculos
# declarados explicitamente por Sergio (2026-09-12), nunca deduzidos automaticamente;
# cada um traz comentário com a evidência (áreas da linha, projetos vinculados, defesas).
# Regra adotada: quem participa de projeto vinculado à linha pertence à linha.
# `projects` foi preenchido a partir das tags dos projetos apenas para exercitar
# a renderização; também precisa de validação.
# ---------------------------------------------------------------------------

section:
  title:
    pt: "Linhas de pesquisa"
    en: "Research lines"
  description:
    pt: "Programas científicos do CEDIS: temas aglutinadores que articulam áreas de atuação, pesquisadores, projetos e produção com uma agenda investigativa própria."
    en: "CEDIS scientific programs: unifying themes that bring together areas of expertise, researchers, projects, and output under a shared research agenda."

research_lines:

  - id: line_software_engineering
    slug: software-engineering
    status: draft
    name:
      pt: "Engenharia de software, arquitetura e qualidade"
      en: "Software engineering, architecture, and quality"
    summary:
      pt: "Como projetar, construir, avaliar e manter sistemas de software com qualidade, sustentabilidade e evolução controlada."
      en: "How to design, build, assess, and maintain software systems with quality, sustainability, and controlled evolution."
    description:
      pt: |
        A linha reúne a tradição do CEDIS em engenharia de software: arquitetura e linhas de produto, engenharia de requisitos, qualidade, verificação, validação e testes, e desenvolvimento sustentável de software. O foco está em métodos, modelos e ferramentas que tornem o processo de construção de software mais previsível e o produto mais confiável.

        Os projetos da linha nascem tanto de demandas de organizações parceiras quanto de questões abertas na literatura, e alimentam disciplinas de graduação e pós-graduação em Engenharia de Software.
      en: |
        This line gathers CEDIS's tradition in software engineering: architecture and product lines, requirements engineering, quality, verification, validation and testing, and sustainable software development. The focus is on methods, models, and tools that make the software construction process more predictable and the product more reliable.

        Projects in this line arise both from partner organizations' needs and from open questions in the literature, and feed undergraduate and graduate courses in Software Engineering.
    questions:
      pt:
        - "Como avaliar e evoluir arquiteturas de software em sistemas de longa vida?"
        - "Que práticas de requisitos e qualidade reduzem retrabalho em equipes pequenas e médias?"
        - "Como medir e reduzir o custo energético e ambiental do software?"
      en:
        - "How can software architectures be assessed and evolved in long-lived systems?"
        - "Which requirements and quality practices reduce rework in small and medium teams?"
        - "How can the energy and environmental cost of software be measured and reduced?"
    methods:
      pt: ["Estudos de caso", "Experimentos controlados", "Revisões sistemáticas", "Pesquisa-ação com organizações parceiras"]
      en: ["Case studies", "Controlled experiments", "Systematic reviews", "Action research with partner organizations"]
    areas:
      - esw
      - software_architecture
      - software_requirements
      - software_quality
      - software_product_line
      - verification_validation_testing
      - green_software
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
      - andre_lanna        # áreas 3; projetos lfs; defesas 15
