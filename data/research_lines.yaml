      - cristiane_ramos    # áreas 4; projetos inovacao_digital_gamificacao,octaanalysis,framework_preditivo_engajamento,a3m,cc; defesas 9
      - george_marsicano   # áreas 5; projetos inovacao_digital_gamificacao,super_r; defesas 12
      - ricardo_ajax       # áreas 2; projetos inovacao_digital_gamificacao; defesas 1
    projects:
      - project_inovacao_digital_gamificacao
      - project_alvorecer
      - project_jornada
      - octaanalysis
      - project_framework_preditivo_engajamento
      - project_a3m
      - project_cc
      - project_super_r
    themes:
      - id: self_determination_theory
        name: { pt: "Teoria da Autodeterminação", en: "Self-Determination Theory" }
      - id: student_engagement
        name: { pt: "Engajamento discente", en: "Student engagement" }
