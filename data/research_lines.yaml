  - id: line_learning_technologies
    slug: learning-technologies
    status: active
    name:
      pt: "Tecnologias para aprendizagem, gamificação e fatores humanos"
      en: "Learning technologies, gamification, and human factors"
    summary:
      pt: "Engajamento, motivação e aprendizagem em ambientes digitais, com gamificação, jogos sérios, metodologias ativas, análise da aprendizagem e trabalho em equipe."
      en: "Engagement, motivation, and learning in digital environments, through gamification, serious games, active methodologies, learning analytics, and teamwork."
    description:
      pt: |
        A linha estuda como tecnologias digitais podem sustentar engajamento e aprendizagem, e como fatores humanos moldam o trabalho de equipes de software. Combina gamificação e jogos sérios fundamentados em teorias de motivação, metodologias ativas de ensino, análise da aprendizagem, ciência da aprendizagem e o desenvolvimento de habilidades socioemocionais e de colaboração em equipes, inclusive na educação em Engenharia de Software.

        É a linha com maior volume de projetos e orientações do centro, com plataformas como Alvorecer Feudal, Jornada IHC e OctaAnalysis e o programa A3M da UnB.
      en: |
        This line studies how digital technologies can sustain engagement and learning, and how human factors shape the work of software teams. It combines gamification and serious games grounded in motivation theories, active teaching methodologies, learning analytics, learning sciences, and the development of socio-emotional and collaboration skills in teams, including in software engineering education.

        It is the center's line with the largest volume of projects and supervisions, with platforms such as Alvorecer Feudal, Jornada IHC, and OctaAnalysis and UnB's A3M program.
    questions:
      pt:
        - "Quais elementos de gamificação sustentam motivação intrínseca ao longo de um semestre?"
        - "Como dados de interação preveem risco de evasão e desengajamento a tempo de intervir?"
        - "Que práticas desenvolvem trabalho em equipe e habilidades socioemocionais em cursos de computação?"
      en:
        - "Which gamification elements sustain intrinsic motivation over a semester?"
        - "How can interaction data predict dropout and disengagement risk in time to intervene?"
        - "Which practices develop teamwork and socio-emotional skills in computing courses?"
    methods:
      pt: ["Estudos quase-experimentais em sala de aula", "Instrumentos psicométricos", "Análise de dados de interação", "Design participativo"]
      en: ["Quasi-experimental classroom studies", "Psychometric instruments", "Interaction data analysis", "Participatory design"]
    history:
      pt: "Evolui a linha \"Ciência da Aprendizagem, Serious Games e Gamificação\" que o grupo já registrava institucionalmente na UnB (SIGAA, 2021–atual), ampliada para análise da aprendizagem, metodologias ativas e fatores humanos em equipes."
      en: "Evolves the line \"Learning Sciences, Serious Games and Gamification\" the group already registered institutionally at UnB (SIGAA, 2021–present), broadened to learning analytics, active methodologies, and human factors in teams."
    areas:
      - gamification
      - active_learning
      - education
      - learning_analytics
      - soft_skills
      - teamwork
    researchers:              # vínculos declarados por Sergio em 2026-09-12 (evidência: áreas da linha / projetos vinculados / defesas)
