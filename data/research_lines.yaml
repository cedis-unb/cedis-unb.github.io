  - id: line_secure_scalable_systems
    slug: secure-scalable-systems
    status: draft
    name:
      pt: "Sistemas seguros, escaláveis e de alto desempenho"
      en: "Secure, scalable, and high-performance systems"
    summary:
      pt: "Segurança cibernética, computação em nuvem e processamento de alto desempenho para sistemas confiáveis em escala."
      en: "Cybersecurity, cloud computing, and high-performance processing for reliable systems at scale."
    description:
      pt: |
        A linha trata das propriedades de infraestrutura que tornam sistemas confiáveis em escala: segurança da informação e fatores humanos em segurança, arquiteturas em nuvem e serverless, e processamento paralelo e massivo de dados. Os projetos combinam pesquisa em desempenho com aplicações reais em órgãos públicos e em plataformas do próprio centro.
      en: |
        This line addresses the infrastructure properties that make systems reliable at scale: information security and human factors in security, cloud and serverless architectures, and parallel, massive data processing. Projects combine performance research with real applications in public agencies and in the center's own platforms.
    questions:
      pt:
        - "Como arquiteturas em nuvem e serverless reduzem custo e tempo de processamento em cargas científicas?"
        - "Que fatores humanos explicam falhas de segurança em organizações e como mitigá-los?"
        - "Como escalar processamento de lagos de dados institucionais com confiabilidade?"
      en:
        - "How do cloud and serverless architectures reduce cost and processing time for scientific workloads?"
        - "Which human factors explain security failures in organizations and how can they be mitigated?"
        - "How can institutional data lake processing be scaled reliably?"
    methods:
      pt: ["Benchmarks de desempenho", "Experimentos em infraestrutura de nuvem", "Surveys e estudos com usuários", "Análise de incidentes"]
      en: ["Performance benchmarks", "Cloud infrastructure experiments", "Surveys and user studies", "Incident analysis"]
