<!-- layouts/shortcodes/tags.html -->
{{ if .Page.Params.tags }}
<div class="not-prose flex pt-6 font-medium text-primary-700 dark:text-primary-100 text-base">
    <span class="pr-2 font-black">{{ i18n "seemore" }}</span>
    <span>
        {{ range $index, $tag := .Page.Params.tags }}
        <a href="{{ printf "/tags/%s" ($tag | urlize) | relLangURL }}" class="inline-flex items-center rounded-md bg-gray-300 px-2.5 py-0.5 text-sm font-medium text-gray-900 no-underline transition-colors hover:bg-primary-200 hover:text-black dark:bg-white/12 dark:text-white dark:hover:bg-primary-300 dark:hover:text-black">
            {{ partial "translated-label.html" (dict "value" $tag) }}
        </a>{{ if ne $index (sub (len $.Page.Params.tags) 1) }}, {{ end }}
        {{ end }}
    </span>
</div>
{{ end }}
