# Configuração do lychee para o CI do site CEDIS.
# Docs: https://lychee.cli.rs/usage/config/

# Timeout por requisição HTTP (segundos).
timeout = 20

# Retry
max_retries = 2
retry_wait_time = 2

# Ser gentil com hosts externos.
max_concurrency = 8

# Cache local para reduzir tráfego entre execuções.
cache = true
max_cache_age = "1d"

# Códigos aceitos (429 = rate limit, permitido para não quebrar CI por
# rate-limit transitório).
accept = [200, 201, 202, 204, 206, 301, 302, 304, 307, 308, 429]

# Exclusões — hosts hostis a bots ou que exigem autenticação e que
# tratamos como "supomos que estão vivos".
exclude = [
  # O próprio domínio: canonical e hreflang são absolutos e apontam para
  # cedis.unb.br. Sem excluir, um PR que introduz página nova sempre
  # falha (a página ainda não existe em produção). Links internos
  # relativos (href="/pt/foo") continuam sendo verificados.
  "^https?://cedis\\.unb\\.br/",

  # SharePoint institucional da UnB — exige SSO Microsoft; sempre 401
  # de fora. Presente em todas as páginas via footer.
  "^https?://unbbr\\.sharepoint\\.com/",

  # Redes sociais e mecanismos anti-bot.
  "^https?://(www\\.)?linkedin\\.com/",
  "^https?://scholar\\.google\\.com/",
  "^https?://(www\\.)?facebook\\.com/",
  "^https?://(www\\.)?instagram\\.com/",
  "^https?://(www\\.)?twitter\\.com/",
  "^https?://(www\\.)?x\\.com/",

  # Redes acadêmicas com anti-bot agressivo (403 para qualquer request
  # sem sessão de usuário).
  "^https?://(www\\.)?academia\\.edu/",
  "^https?://(www\\.)?researchgate\\.net/",
  "^https?://(www\\.)?dokumen\\.tips/",

  # Repositórios acadêmicos brasileiros com renderização lenta ou
  # anti-bot agressivo — podem passar a ser incluídos gradualmente.
  "^https?://www\\.bdm\\.unb\\.br/",
  "^https?://repositorio\\.unb\\.br/",
  "^https?://(www\\.)?bdtd\\.ibict\\.br/",
  "^https?://repositorio\\.enap\\.gov\\.br/",

  # Cadeia SSL mal configurada (certificado válido, chain incompleta).
  # Links funcionam em browsers modernos (que baixam intermediários).
  "^https?://periodicos\\.se\\.df\\.gov\\.br/",
  "^https?://periodicos\\.unb\\.br/",
  "^https?://livros\\.unb\\.br/",

  # DOI publisher redirects — quase todos os editores (ACM, IEEE, MDPI,
  # Wiley, Elsevier, SciELO) bloqueiam bots com 403. O DOI resolve
  # tecnicamente; o publisher final é que rejeita. Excluir doi.org
  # inteiro é o único fix prático — se um DOI está errado no dado, isso
  # aparece como erro de resolução (não 403) e não é mascarado.
  "^https?://doi\\.org/",

  # Instituições com sites que rejeitam tráfego de bots ou têm janelas
  # transitórias de indisponibilidade.
  "^https?://(www\\.)?fap\\.df\\.gov\\.br/",
  "^https?://cbsoft\\.sbc\\.org\\.br/",
  "^https?://(www\\.)?dominiopublico\\.gov\\.br/",
  "^https?://lattes\\.cnpq\\.br/",
  "^https?://(www\\.)?lume\\.ufrgs\\.br/",
  "^https?://unbbr-my\\.sharepoint\\.com/",

  # CDN Google user content — tokens de foto expiram; falso positivo.
  "^https?://lh[0-9]+\\.googleusercontent\\.com/",

  # TODO: github.com/CedisUnB/Atloria retorna 404 em 2026-07-28.
  # Investigar se o repo foi renomeado/tornado privado antes de reincluir.
  "^https?://github\\.com/CedisUnB/Atloria",
]

# Nota: exclusão de mailto: e IPs privados usa os defaults do lychee
# (mailtos ignorados por padrão; endereços privados também).
