name: site-ci

# Executa a construção do site e validações leves em todo push para main
# e em todo pull request. Fase 1 do PLANO-AUDITORIA-2026 (issue I01).
#
# Não faz deploy. O deploy segue via docs/ versionado no commit até que
# essa etapa também seja movida para o CI (previsto em fase posterior).

on:
  push:
    branches: [main]
    # Ignora commits que apenas regeneram docs/ ou modificam docs de
    # metadados (evita jobs redundantes).
    paths-ignore:
      - 'docs/**'
      - '.tool-versions'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas de uma mesma branch se houver push novo.
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: '0.166.0'
  NODE_VERSION: '24'
  HUGO_ENV: production

jobs:
  build:
    name: build + validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Necessário porque hugo.yaml tem enableGitInfo: true.
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python validation dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate sources (npm test)
        # Mesma suíte do desenvolvimento local: páginas geradas de publicações e
        # de linhas de pesquisa, modo escuro por classe, coerência de versão do
        # Alpine, dados de conteúdo e paridade PT/EN. Antes o CI rodava só parte
        # disso, então verde no CI e verde local não queriam dizer o mesmo.
        run: npm test
        env:
          CEDIS_VALIDATE_REPORT: content-validation-report.md
          CEDIS_I18N_REPORT: i18n-validation-report.md

      - name: Build site (Hugo)
        run: python3 scripts/build_publications.py && hugo --gc --minify --destination public

      - name: Validate rendered HTML
        # Invariantes de produto que Pa11y e Lighthouse não pegam: headings e
        # estado vazio de Oportunidades, breadcrumb duplicado, divergência entre
        # trilha visível e JSON-LD, aria-controls órfão, tempo de leitura em
        # listagem de pesquisadores e cards contextuais de áreas nos perfis.
        run: python3 scripts/validate_rendered.py public

      - name: Build Pagefind index
        run: npx --no-install pagefind --site public

      - name: Start local audit server (com gzip nativo — python http.server distorce Lighthouse)
        run: npx --yes serve public -l 4173 --no-clipboard > /tmp/cedis-site-ci-http.log 2>&1 &

      - name: Wait for local audit server
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cedis-site-ci-http.log || true
          exit 1

      - name: Accessibility audit (pa11y-ci)
        run: npx --no-install pa11y-ci --config .pa11yci.json --json > pa11y-report.json
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      - name: Lighthouse CI
        run: npx --no-install lhci autorun --config=lighthouserc.json

      # O glob vinha SEM aspas, então o shell o expandia antes do lychee e
      # cobria um único nível de diretório: 815 links únicos em vez dos 9336
      # do site inteiro — ~1,5% das páginas. Com aspas, quem expande é o
      # lychee, recursivamente.
      - name: Link check — internos (lychee offline)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolve links absolutos root-relative (href="/pt/foo")
          # contra o diretório local do build. Precisa ser caminho absoluto.
          # Só links locais: determinístico, cobre 100% das páginas e roda em
          # segundos. Este é o portão.
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/public
            --exclude '^https?://'
            'public/**/*.html'
          fail: true
          output: lychee-internal-report.md

      - name: Link check — externos (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --root-dir ${{ github.workspace }}/public
            'public/**/*.html'
          # Informativo, não bloqueante: são 9336 links externos, boa parte em
          # repositórios acadêmicos brasileiros que oscilam. Duas execuções
          # locais do mesmo conteúdo em 2026-09-27 deram 5 e 53 erros, quase
          # todos timeout. Bloquear nisso deixaria o CI vermelho por
          # indisponibilidade de terceiros. O relatório vai para o resumo do
          # job e para os artefatos, e o apodrecimento de links é tratado a
          # partir dele.
          fail: false
          jobSummary: true
          output: lychee-report.md

      - name: Upload lychee reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: |
            lychee-report.md
            lychee-internal-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload pa11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pa11y-report
          path: pa11y-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lhci-report
          path: lhci-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload content validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-validation-report
          path: content-validation-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload i18n validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i18n-validation-report
          path: i18n-validation-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload built site
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: public
          retention-days: 7
